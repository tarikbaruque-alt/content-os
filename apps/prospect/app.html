<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}html,body{margin:0}body{font:14px system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Mesa de Prospecção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mesa de Prospecção — layout: barra de navegação fixa no topo + área de trabalho em uma coluna;
   no prospect, formulário à esquerda e leitura viva à direita (empilha no celular). */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --surface-2: #E9EEF2;
  --ink: #14232B;
  --muted: #56646F;
  --line: #D6DEE4;
  --brand: #0B6E6B;
  --brand-ink: #FFFFFF;
  --brand-soft: #DCEFED;
  --forte: #2C8A57;
  --regular: #A87600;
  --fraca: #C75A1C;
  --ausente: #B8352E;
  --hip: #8A5F00;
  --hip-bg: #FFF1CF;
  --obs-bg: #DCEFED;
  --conf-bg: #D9F1E2;
  --danger-bg: #FBE1DE;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E171C; --surface: #152229; --surface-2: #1D2E37; --ink: #E8EEF1; --muted: #9BABB5; --line: #29414C;
    --brand: #3DB8B1; --brand-ink: #06201E; --brand-soft: #123B3A;
    --forte: #58C78C; --regular: #E2B23F; --fraca: #F08A55; --ausente: #F0776F;
    --hip: #E7B84F; --hip-bg: #3A2F12; --obs-bg: #123B3A; --conf-bg: #143A28; --danger-bg: #41211E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E171C; --surface: #152229; --surface-2: #1D2E37; --ink: #E8EEF1; --muted: #9BABB5; --line: #29414C;
  --brand: #3DB8B1; --brand-ink: #06201E; --brand-soft: #123B3A;
  --forte: #58C78C; --regular: #E2B23F; --fraca: #F08A55; --ausente: #F0776F;
  --hip: #E7B84F; --hip-bg: #3A2F12; --obs-bg: #123B3A; --conf-bg: #143A28; --danger-bg: #41211E;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 200px; }
.sp { flex: 1; }

/* barra */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 10px 16px; }
.top .wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
@media (max-width: 640px) { .top { position: static; } }
.brand { font-family: var(--font-display); font-size: 20px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.brand b { color: var(--brand); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.pill { font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.pill.ok { border-color: var(--forte); color: var(--forte); }
.pill.warn { border-color: var(--regular); color: var(--regular); }

main { padding-block: 22px; }
.page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-title h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -.02em; }
.lede { max-width: 62ch; color: var(--muted); margin-top: 6px; }

/* cartões e formulários */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card.flat { background: transparent; }
.card h3 { font-size: 17px; margin-bottom: 10px; }
.card h4 { font-size: 14px; margin-bottom: 6px; }
.sect-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; display: block; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type="text"], input[type="number"], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); min-width: 0; }
textarea { resize: vertical; min-height: 68px; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
details.card > summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); }
details.card[open] > summary::after { content: "–"; }
details.card[open] > summary { margin-bottom: 12px; }

/* botões */
.btn { background: var(--brand); color: var(--brand-ink); border: 1px solid var(--brand); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--ausente); border-color: var(--ausente); }
.btn.big { padding: 11px 20px; font-size: 16px; }
.link { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* selos */
.badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.badge.OBSERVADO { background: var(--obs-bg); color: var(--brand); }
.badge.HIPOTESE { background: var(--hip-bg); color: var(--hip); }
.badge.CONFIRMADO { background: var(--conf-bg); color: var(--forte); }
.badge.SISTEMA { background: var(--surface-2); color: var(--muted); }
.prio { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.prio.ALTA { color: var(--forte); } .prio.MEDIA { color: var(--regular); } .prio.BAIXA { color: var(--muted); } .prio.INDEFINIDA { color: var(--muted); border-style: dashed; }

/* avaliação */
.dim { display: grid; grid-template-columns: minmax(150px, 1.1fr) auto minmax(120px, 1.4fr); gap: 8px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.dim:first-of-type { border-top: 0; }
.dim .lab { font-weight: 500; }
.dim .hint:empty { display: none; }
.dim .hint { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: -4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 9px; cursor: pointer; font-size: 12.5px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--surface-2); }
.seg button.on { color: #fff; font-weight: 600; }
.seg button.on[data-val="forte"] { background: var(--forte); }
.seg button.on[data-val="regular"] { background: var(--regular); }
.seg button.on[data-val="fraca"] { background: var(--fraca); }
.seg button.on[data-val="ausente"] { background: var(--ausente); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--line); }
.dot.forte { background: var(--forte); } .dot.regular { background: var(--regular); } .dot.fraca { background: var(--fraca); } .dot.ausente { background: var(--ausente); }
@media (max-width: 640px) { .dim { grid-template-columns: 1fr; } .seg { width: 100%; } .seg button { flex: 1; } }

/* área do prospect */
.lead-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.lead-head h1 { font-size: clamp(22px, 3.4vw, 30px); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 13px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.sticky { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 84px); overflow: auto; padding-right: 2px; }
@media (max-width: 920px) { .split { grid-template-columns: 1fr; } .sticky { position: static; max-height: none; } }

/* itens */
.item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); }
.item + .item { margin-top: 10px; }
.item.hyp { border-left: 4px solid var(--regular); }
.item.conf { border-left: 4px solid var(--forte); }
.item.obs { border-left: 4px solid var(--brand); }
ul.clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
ul.clean li { display: flex; gap: 8px; align-items: baseline; }
ul.clean li::before { content: "›"; color: var(--brand); font-weight: 700; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.quote { font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; margin-top: 4px; overflow-wrap: anywhere; }
.msg { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.polished { background: var(--brand-soft); }
.callout { border-radius: 8px; padding: 10px 12px; background: var(--hip-bg); color: var(--ink); font-size: 13.5px; }
.callout.bad { background: var(--danger-bg); }
.callout.good { background: var(--conf-bg); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }

/* lista de prospects */
.lead-row { display: grid; grid-template-columns: minmax(0, 2fr) auto auto auto; gap: 10px 14px; align-items: center; padding: 12px 14px; }
.lead-row + .lead-row { border-top: 1px solid var(--line); }
.lead-row .name { font-weight: 600; cursor: pointer; text-align: left; background: none; border: 0; padding: 0; }
.lead-row .name:hover { color: var(--brand); text-decoration: underline; }
.score { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 680px) { .lead-row { grid-template-columns: 1fr auto; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); }

/* mini auditoria (visual) */
.audit { display: grid; gap: 10px; }
.audit .blk { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.audit .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 500; font-size: 13px; background: var(--brand-soft); color: var(--brand); }
.audit .blk.warn .ico { background: var(--hip-bg); color: var(--hip); }
.audit .blk h4 { margin-bottom: 2px; }
.semaforo { display: flex; gap: 8px; flex-wrap: wrap; }
.semaforo span { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); display: inline-flex; align-items: center; }

/* pitch */
.pitch-sec { padding: 12px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 130px 1fr; gap: 6px 16px; }
.pitch-sec:first-child { border-top: 0; }
.pitch-sec .t { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--brand); font-weight: 500; }
@media (max-width: 640px) { .pitch-sec { grid-template-columns: 1fr; } }

.ladder { display: grid; gap: 8px; }
.ladder .step { display: grid; grid-template-columns: 8px 1fr; gap: 12px; }
.ladder .step i { background: var(--line); border-radius: 4px; }
.ladder .step.prio i { background: var(--brand); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 520px); z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .nav button, .tabs button { transition: background .12s, color .12s, filter .12s; } }
</style>

  const el = $('#storage-pill');
  if (el) { el.textContent = kind === 'db' ? 'Salvo no banco do Artifact' : 'Salvo só neste navegador'; el.className = 'pill ' + (kind === 'db' ? 'ok' : 'warn'); }
}
function dbFail(e) {
  toast('Não consegui salvar no banco (' + ((e && e.code) || 'erro') + '). Seus dados continuam neste navegador.');
  setStorage('local');
}
async function writeLead(id) {
  const lead = S.leads.find((l) => l.profile.id === id);
  if (!lead || !db) return;
  const prev = writing.get(id) || Promise.resolve();
  const p = prev.then(() => db.doc('pro_leads/' + id).set(clean(lead))).catch(dbFail);
  writing.set(id, p);
  await p;
}
function saveLead(lead) {
  lead.atualizadoEm = new Date().toISOString();
  persistLocal();
  if (!db) return;
  const id = lead.profile.id;
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => writeLead(id), 700));
}
function saveOp() {
  persistLocal();
  if (!db) return;
  clearTimeout(opTimer);
  opTimer = setTimeout(() => { db.doc('pro_config/main').set(clean(S.op)).catch(dbFail); }, 700);
}
function removeLead(id) {
  S.leads = S.leads.filter((l) => l.profile.id !== id);
  persistLocal();
  if (db) db.doc('pro_leads/' + id).delete().catch(dbFail);
}

function mergeLeads(remote) {
  const byId = new Map(S.leads.map((l) => [l.profile.id, l]));
  const push = [];
  for (const r of remote) {
    const l = byId.get(r.profile.id);
    if (!l) byId.set(r.profile.id, r);
    else if ((r.atualizadoEm || '') >= (l.atualizadoEm || '')) byId.set(r.profile.id, r);
    else push.push(l.profile.id);
  }
  for (const l of S.leads) if (!remote.some((r) => r.profile.id === l.profile.id)) push.push(l.profile.id);
  S.leads = Array.from(byId.values());
  return push;
}

async function connect() {
  const c = window.claude;
  if (!c || !c.use) return;
  const get = async (n) => { try { return await c.use(n); } catch (e) { return null; } };
  const [d, s, x] = await Promise.all([get('db'), get('sample'), get('downloads')]);
  sampleFn = s || null; dl = x || null;
  S.canSample = !!sampleFn; S.canDownload = !!dl;
  if (d) {
    try {
      const [snap, cfg] = await Promise.all([d.collection('pro_leads').get(), d.doc('pro_config/main').get()]);
      db = d;
      const remote = snap.docs.map((x) => E.normalizeLead(x.data())).filter(Boolean);
      const push = mergeLeads(remote);
      if (cfg.exists) S.op = E.normalizeOperacao(cfg.data()); else saveOp();
      persistLocal();
      setStorage('db');
      for (const id of push) writeLead(id);
    } catch (e) { db = null; setStorage('local'); }
  }
  render();
}

let toastT = null;
function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 4600);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado.'); return; } catch (e) { /* tenta alternativa */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? 'Copiado.' : 'Não consegui copiar sozinho: selecione o texto e copie.');
}
function setPath(o, path, val) {
  const ks = path.split('.');
  let cur = o;
  for (let i = 0; i < ks.length - 1; i++) { if (cur[ks[i]] == null || typeof cur[ks[i]] !== 'object') cur[ks[i]] = {}; cur = cur[ks[i]]; }
  const last = ks[ks.length - 1];
  if (val === '' || val == null || (typeof val === 'number' && Number.isNaN(val))) delete cur[last]; else cur[last] = val;
  if ((ks[1] === 'dims' || ks[1] === 'header') && ks.length >= 4) {
    const box = o[ks[0]][ks[1]][ks[2]];
    if (box && !box.nota) box.nota = 'nao_avaliado';
  } else if ((ks[1] === 'negocio' || ks[1] === 'capacidade') && ks.length === 3) {
    const box = o[ks[0]][ks[1]];
    if (box && !box.nota) box.nota = 'nao_avaliado';
  }
}

const AI_ERR = {
  not_granted: 'A IA não foi liberada para esta página (você pode permitir quando ela pedir).',
  sampling_disabled: 'A IA não está disponível para esta conta.',
  rate_limited: 'Limite de uso da IA atingido. Tente novamente mais tarde.',
  invalid_json: 'A IA não devolveu um formato válido. Tente de novo.',
  refused: 'A IA recusou esta entrada. Revise o texto e tente de novo.',
  prompt_too_large: 'O texto colado é grande demais. Cole um trecho menor.',
  session_expired: 'Sua sessão expirou. Entre novamente.',
};
function aiErr(e) { return AI_ERR[e && e.code] || 'A IA falhou agora. Tente novamente em instantes.'; }

async function aiRaioX(lead) {
  if (!sampleFn) return;
  const src = E.aiSourceText(lead);
  if (src.trim().length < 20) { toast('Cole a bio, legendas ou notas (mín. algumas linhas) para a IA analisar.'); return; }
  S.sampling = 'raiox'; refreshResults();
  try {
    const data = await sampleFn.json(E.buildAiRaioXPrompt(lead, S.op), { modelTier: 'default' });
    S.ai[lead.profile.id] = E.parseAiRaioX(data, src);
  } catch (e) {
    if (!e || e.code !== 'cancelled') toast(aiErr(e));
  } finally { S.sampling = null; refreshResults(); }
}
async function aiPolish(lead, idx) {
  if (!sampleFn) return;
  const a = analysis(lead);
  if (E.isRefusal(a.approach)) return;
  const orig = a.approach.variantes[idx];
  if (!orig) return;
  const anchors = [lead.profile.temaDominado || ''].filter(Boolean);
  const key = lead.profile.id + ':' + idx;
  S.polish[key] = { busy: true }; render();
  try {
    const { text } = await sampleFn(E.buildPolishPrompt(orig.texto, anchors), { modelTier: 'quick', cache: false });
    const v = E.validatePolish(orig.texto, text, S.op, anchors, true);
    S.polish[key] = v.ok ? { ok: true, text: text.trim() } : { ok: false, motivos: v.motivos };
  } catch (e) { S.polish[key] = { ok: false, motivos: [aiErr(e)] }; }
  render();
}

          <label class="f">Margem mínima (%)<input type="number" min="0" max="100" data-op="regras.margemMinimaPct" value="${op.regras.margemMinimaPct != null ? op.regras.margemMinimaPct : ''}"></label>
        </div>
        <label class="f">Condições para conceder desconto, uma por linha<textarea data-op="regras.descontoCondicoes" data-lines="1" rows="2">${esc((op.regras.descontoCondicoes || []).join('\n'))}</textarea></label>
        <label class="row"><input type="checkbox" data-op="regras.faseInicialPermitida" data-bool="1" ${op.regras.faseInicialPermitida === false ? '' : 'checked'}> Posso propor uma fase inicial menor</label>
      </section>

      <section class="card stack"><h3>Backup</h3>
        <p class="small muted">Seus dados ficam ${S.storage === 'db' ? 'no banco deste Artifact' : 'só neste navegador'}. Guarde uma cópia quando quiser.</p>
        <div class="row">
          ${S.canDownload ? '<button type="button" class="btn ghost" data-act="exportBackup">Exportar backup (.json)</button>' : '<span class="small muted">Exportar não está disponível neste ambiente.</span>'}
          <label class="btn ghost" style="cursor:pointer">Importar backup<input type="file" id="imp-file" accept=".json,application/json" hidden></label>
        </div>
      </section>
    </div>`;
}

function proofRow(kind, d, i) {
  return `<div class="item ${d.verificado ? 'conf' : 'hyp'}">
    <div class="row"><b>${esc(d.titulo)}</b><span class="badge ${d.verificado ? 'CONFIRMADO' : 'HIPOTESE'}">${d.verificado ? 'verificado' : 'não verificado'}</span><span class="sp"></span>
      <button type="button" class="btn ghost small" data-act="toggleProof" data-kind="${kind}" data-i="${i}">${d.verificado ? 'Marcar como não verificado' : 'Marcar como verificado'}</button>
      <button type="button" class="link small" data-act="delProof" data-kind="${kind}" data-i="${i}">remover</button></div>
    <p class="small">${esc(d.descricao)}</p>
    <p class="small muted">Fonte: ${esc(d.fonte)}${d.resultadoDocumentado ? ' · Resultado documentado: ' + esc(d.resultadoDocumentado) : ''}</p></div>`;
}
function proofForm(kind, withResult) {
  return `<details class="card flat"><summary>Adicionar</summary>
    <div class="g2">
      <label class="f">Título<input type="text" id="${kind}-t"></label>
      ${kind === 'provas' ? `<label class="f">Tipo<select id="${kind}-tipo">${['case', 'portfolio', 'depoimento', 'resultado', 'cliente', 'experiencia', 'metodologia', 'processo', 'especializacao', 'estrutura'].map((t) => `<option>${t}</option>`).join('')}</select></label>` : ''}
      <label class="f">Onde está documentado (fonte)<input type="text" id="${kind}-f" placeholder="link, contrato, print…"></label>
    </div>
    <label class="f">Descrição<textarea id="${kind}-d" rows="2"></textarea></label>
    ${withResult ? `<label class="f">Resultado documentado (obrigatório p/ case, depoimento e resultado)<input type="text" id="${kind}-r"></label>` : ''}
    <div class="row"><label class="row"><input type="checkbox" id="${kind}-v"> Já verifiquei esta informação</label><button type="button" class="btn ghost" data-act="addProof" data-kind="${kind}">Adicionar</button></div>
  </details>`;
}

/* ===== Área de trabalho do prospect ===== */
const badge = (c) => `<span class="badge ${c}">${CERTEZA_LABEL[c] || c}</span>`;
const val = (o, p) => p.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o);
const dot = (n) => `<span class="dot ${n}"></span>`;
const copyBtn = (text, label) => `<button type="button" class="btn ghost small" data-act="copyText" data-text="${esc(text)}">${label || 'Copiar'}</button>`;
const claimLi = (c) => `<li><span>${esc(c.texto)} ${badge(c.certeza)}${c.evidencia ? `<div class="quote">${esc(c.evidencia)}</div>` : ''}</span></li>`;

function fText(lead, path, label, o) {
  o = o || {};
  const v = val(lead, path);
  const shown = path === 'profile.nicho' ? nichoNome(lead) : v;
  const attrs = `data-bind="${path}" ${o.t ? `data-t="${o.t}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.list ? `list="${o.list}"` : ''}`;
  const field = o.area ? `<textarea ${attrs} rows="${o.rows || 3}">${esc(shown == null ? '' : shown)}</textarea>` : `<input type="${o.num ? 'number' : 'text'}" ${o.num ? 'min="0" step="1"' : ''} ${attrs} value="${esc(shown == null ? '' : shown)}">`;
  return `<label class="f">${label}${field}</label>`;
}
function fSel(lead, path, label, opts, t) {
  const v = val(lead, path);
  const cur = t === 'bool3' ? (v === true ? 'sim' : v === false ? 'nao' : '') : (v == null ? '' : v);
  return `<label class="f">${label}<select data-bind="${path}" ${t ? `data-t="${t}"` : ''}><option value="">Não sei</option>${opts.map(([k, l]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
}
function seg(kind, key, cur) {
  return `<div class="seg" role="group" aria-label="Avaliação">${['forte', 'regular', 'fraca', 'ausente'].map((v) => `<button type="button" data-act="nota" data-kind="${kind}" data-key="${key}" data-val="${v}" class="${cur === v ? 'on' : ''}" aria-pressed="${cur === v}">${NOTA_LABEL[v]}</button>`).join('')}</div>`;
}
function dimRow(lead, kind, key, label, hint) {
  const flat = kind === 'flat';
  const box = (flat ? lead.profile[key] : (lead.profile[kind] || {})[key]) || {};
  const bindPath = flat ? `profile.${key}.obs` : `profile.${kind}.${key}.obs`;
  const cur = box.nota && box.nota !== 'nao_avaliado' ? box.nota : '';
  return `<div class="dim" data-kind="${kind}" data-key="${key}">
    <div class="lab">${esc(label)}</div>${seg(kind, key, cur)}
    <input type="text" data-bind="${bindPath}" value="${esc(box.obs || '')}" placeholder="O que você viu (fato)" aria-label="Observação: ${esc(label)}">
    <div class="hint" data-hint>${esc(hint || '')}</div></div>`;
}

function viewLead() {
  const lead = curLead();
  if (!lead) return '<div class="empty"><h3>Prospect não encontrado</h3></div>';
  const a = analysis(lead);
  return `
    <div id="lead-head">${leadHead(lead, a)}</div>
    <div class="tabs" role="tablist" aria-label="Etapas do prospect">${list(TABS, ([k, t]) => `<button type="button" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-tab="${k}">${t}</button>`)}</div>
    ${tabBody(lead, a)}`;
}

function leadHead(lead, a) {
  return `<div class="lead-head">
    <button type="button" class="btn ghost small" data-act="goProspects">← Prospects</button>
    <h1>${esc(lead.profile.nome)}</h1>
    <span class="muted">@${esc(lead.profile.handle)} · ${esc(nichoNome(lead) || 'sem nicho')}</span>
    <span class="sp"></span>
    <span class="prio ${a.score.prioridade}" title="${esc(a.score.avisos.join(' '))}">${PRIO_LABEL[a.score.prioridade]} · ${a.score.pontuacao}/100</span>
    <label class="f" style="min-width:150px"><span class="mono" style="font-size:10px">ETAPA</span>
      <select data-status="${esc(lead.profile.id)}" aria-label="Etapa">${E.LEAD_STATUS.map((s) => `<option value="${s}" ${lead.status === s ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></label>
  </div>`;
}

function tabBody(lead, a) {
  switch (S.tab) {
    case 'raiox': return tabRaioX(lead, a);
    case 'why': return tabWhy(lead, a);
    case 'audit': return tabAudit(lead, a);
    case 'approach': return tabApproach(lead, a);
    case 'qual': return tabQual(lead, a);
    case 'args': return tabArgs(lead, a);
    case 'obj': return tabObj(lead, a);
    case 'pitch': return tabPitch(lead, a);
    default: return '';
  }
}

/* atualização viva: só a coluna de leitura, o cabeçalho e as dicas — sem tirar o foco do formulário */
let pointerDown = false, refreshPending = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const pointerRelease = () => { pointerDown = false; if (refreshPending) { refreshPending = false; setTimeout(refreshResults, 0); } };
document.addEventListener('pointerup', pointerRelease, true);
document.addEventListener('pointercancel', pointerRelease, true);

function refreshResults() {
  // Se um clique está em andamento (o campo acabou de perder o foco), redesenhar agora engoliria o clique:
  // adia até o mouse soltar, depois do evento de clique.
  if (pointerDown) { refreshPending = true; return; }
  const lead = curLead();
  if (!lead) return;
  const a = analysis(lead);
  const h = $('#lead-head');
  if (h) h.innerHTML = leadHead(lead, a);
  const slot = $('#results');
  if (slot) slot.innerHTML = S.tab === 'raiox' ? raioxResults(lead, a) : S.tab === 'qual' ? qualResults(lead, a) : '';
  const dims = a.raiox.dims;
  $$('.dim[data-kind="dims"]').forEach((row) => {
    const d = dims.find((x) => x.key === row.dataset.key);
    const box = (lead.profile.dims || {})[row.dataset.key] || {};
    const manual = box.nota && box.nota !== 'nao_avaliado';
    const el = $('[data-hint]', row);
    if (el) el.textContent = !manual && d && d.origem === 'contagem' ? `Derivado dos números informados: ${d.nota} (${d.base})` : '';
  });
}

/* ---------- Raio-X ---------- */
function tabRaioX(lead, a) {
  const p = lead.profile;
  const dimRows = (grupo) => list(E.DIMENSOES.filter((d) => d.grupo === grupo), (d) => {
    const eff = a.raiox.dims.find((x) => x.key === d.key);
    const manual = (p.dims[d.key] || {}).nota && p.dims[d.key].nota !== 'nao_avaliado';
    return dimRow(lead, 'dims', d.key, d.label, !manual && eff && eff.origem === 'contagem' ? `Derivado dos números informados: ${eff.nota} (${eff.base})` : '');
  });
  const grupos = [['perfil', 'Perfil e apresentação'], ['cadencia', 'Cadência'], ['formato', 'Formatos'], ['conversao', 'Conversão'], ['conteudo', 'Conteúdo'], ['funil', 'Funil de conteúdo']];
  return `
    <datalist id="nichos-list3">${list(E.allNiches(S.op), (n) => `<option value="${esc(n.nome)}"></option>`)}</datalist>
    <div class="split">
      <div class="stack">
        <details class="card" open><summary>1 · Perfil</summary><div class="stack">
          <div class="g2">
            ${fText(lead, 'profile.nome', 'Nome do negócio ou pessoa')}
            ${fText(lead, 'profile.contato', 'Nome de quem vou abordar', { ph: 'Ex.: Helena' })}
            ${fText(lead, 'profile.nicho', 'Nicho', { t: 'nicho', list: 'nichos-list3', ph: 'Escolha ou digite' })}
            ${fText(lead, 'profile.cidade', 'Cidade')}
            ${fText(lead, 'profile.seguidores', 'Seguidores (opcional)', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.link', 'Link da bio (opcional)')}
          </div>
          ${fText(lead, 'profile.temaDominado', 'O que este perfil demonstra dominar (fato que você viu)', { ph: 'Ex.: dermatologia estética' })}
          ${fText(lead, 'profile.bio', 'Bio (cole o texto)', { area: 1, rows: 2 })}
        </div></details>

        <details class="card"><summary>2 · Números observados</summary><div class="stack">
          <p class="small muted">Contagens simples que você vê no perfil. Viram avaliação automática (critério: 0 = ausente; poucos = fraca), e você pode sobrescrever abaixo.</p>
          <div class="g3">
            ${fText(lead, 'profile.posts30d', 'Posts nos últimos 30 dias', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.reels30d', 'Reels nos últimos 30 dias', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.carrosseis30d', 'Carrosséis nos últimos 30 dias', { num: 1, t: 'num' })}
            ${fSel(lead, 'profile.stories', 'Stories', [['diario', 'Todo dia'], ['semanal', 'Toda semana'], ['raro', 'Raramente'], ['nunca', 'Nunca']])}
            ${fSel(lead, 'profile.ctaNaBio', 'Tem CTA na bio?', [['sim', 'Sim'], ['nao', 'Não']], 'bool3')}
          </div>
          <span class="sect-label">Tipos dos últimos posts (conte ao menos 6 no total)</span>
          <div class="g3">
            ${fText(lead, 'profile.mix.educativo', 'Educativos', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.mix.comercial', 'Comerciais', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.mix.institucional', 'Institucionais', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.mix.pessoal', 'Pessoais / bastidores', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.mix.provaSocial', 'Prova social', { num: 1, t: 'num' })}
          </div>
          <span class="sect-label">Funil dos últimos posts</span>
          <div class="g3">
            ${fText(lead, 'profile.funil.descoberta', 'Descoberta', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.funil.consideracao', 'Consideração', { num: 1, t: 'num' })}
            ${fText(lead, 'profile.funil.conversao', 'Conversão', { num: 1, t: 'num' })}
          </div>
        </div></details>

        <details class="card"><summary>3 · Avaliação por dimensão (19)</summary><div>
          <p class="small muted" style="margin-bottom:8px">Avalie o que você consegue observar; deixe em branco o que não deu para ver. Clique de novo no botão marcado para limpar. Escreva o fato observado — ele vira a evidência.</p>
          ${list(grupos, ([g, t]) => `<span class="sect-label" style="margin-top:12px">${t}</span>${dimRows(g)}`)}
        </div></details>

        <details class="card"><summary>4 · Cabeçalho do perfil</summary><div>
          <p class="small muted" style="margin-bottom:8px">Teste: alguém que olhasse só esta área entenderia para quem é o perfil e o que fazer?</p>
          ${list(E.HEADER_PARTS, (h) => dimRow(lead, 'header', h.key, h.label, h.dica))}
        </div></details>

        <details class="card"><summary>5 · O negócio</summary><div class="stack">
          <p class="small muted">Sua leitura de quão bom é o negócio e de quanto ele pode investir — com o fato que sustenta.</p>
          ${dimRow(lead, 'flat', 'negocio', 'Tem um bom negócio', '')}
          ${dimRow(lead, 'flat', 'capacidade', 'Capacidade de investimento', '')}
        </div></details>

        <details class="card"><summary>6 · Observações reais e texto para IA</summary><div class="stack">
          <span class="sect-label">Observações com fonte (viram motivo legítimo de contato)</span>
          <div id="notas-list">${notasList(lead)}</div>
          <div class="g2">
            <label class="f">Observação (fato)<input type="text" id="nt-texto" placeholder="Ex.: o site não mostra o cardápio"></label>
            <label class="f">Onde viu<input type="text" id="nt-fonte" placeholder="Ex.: Instagram (bio)"></label>
          </div>
          <div class="row"><button type="button" class="btn ghost" data-act="addNota">Adicionar observação</button></div>
          ${fText(lead, 'profile.amostraTexto', 'Legendas e textos colados (só para a análise de IA)', { area: 1, rows: 4, ph: 'Cole 3 a 5 legendas recentes' })}
        </div></details>
      </div>
      <aside class="sticky" aria-label="Leitura do perfil"><div id="results" class="stack">${raioxResults(lead, a)}</div></aside>
    </div>`;
}

function notasList(lead) {
  const n = lead.profile.notas;
  return n.length ? `<ul class="clean">${list(n, (x, i) => `<li><span>${esc(x.texto)} <span class="muted small">— ${esc(x.fonte)}</span> <button type="button" class="link small" data-act="delNota" data-i="${i}">remover</button></span></li>`)}</ul>` : '<p class="small muted">Nenhuma observação ainda.</p>';
}

function raioxResults(lead, a) {
  const r = a.raiox;
  const painLabel = (k) => (E.PAINS.find((p) => p.key === k) || {}).label || k;
  const hyp = r.dores.filter((d) => d.status === 'HIPOTESE');
  const conf = r.dores.filter((d) => d.status === 'CONFIRMADO');
  const talk = r.dores.filter((d) => d.status === 'SO_CONVERSA');
  return `
    <div class="card stack">
      <div class="row"><h3>Leitura do perfil</h3><span class="sp"></span>
        <span class="pill ${r.confianca === 'alta' ? 'ok' : r.confianca === 'media' ? '' : 'warn'}">confiança ${r.confianca}</span><span class="pill">${r.avaliadas}/19 avaliadas</span></div>
      <p class="small muted">Tudo é hipótese até o prospect confirmar. As evidências são os fatos que você informou.</p>
      ${list(r.lacunas, (l) => `<div class="callout">${esc(l)}</div>`)}
    </div>
    <div class="card stack">
      <h3>Gargalos possíveis</h3>
      ${r.gargalos.length ? list(r.gargalos, (g) => `<div class="item ${g.certeza === 'CONFIRMADO' ? 'conf' : 'hyp'}">
        <div class="row"><b>${esc(g.def.titulo)}</b>${badge(g.certeza)}</div>
        <ul class="plain small" style="margin-top:6px">${list(g.evidencias, (e) => `<li>${esc(e)}</li>`)}</ul>
        <p class="small" style="margin-top:6px"><span class="muted">Pode gerar:</span> ${esc(g.def.impacto)}.</p>
        <p class="small"><span class="muted">Serviços que respondem:</span> ${esc(g.def.servicos.map((k) => E.SERVICE_BY_KEY[k].nome).join(' · '))}</p></div>`)
        : '<p class="small muted">Nenhum gargalo identificado nos dados informados. Falta de dado não é problema do perfil: avalie mais dimensões.</p>'}
    </div>
    <div class="card stack">
      <h3>Dores a investigar</h3>
      <p class="small muted">Nenhuma dor é assumida. Estas são hipóteses para confirmar com perguntas.</p>
      ${conf.length ? `<div><span class="sect-label">Confirmadas</span>${list(conf, (d) => `<div class="item conf"><div class="row"><b>${esc(d.label)}</b>${badge('CONFIRMADO')}<span class="sp"></span><button type="button" class="link small" data-act="toggleDor" data-key="${d.key}">desmarcar</button></div></div>`)}</div>` : ''}
      ${hyp.length ? `<div><span class="sect-label">Hipóteses com sinal no perfil</span>${list(hyp, (d) => `<div class="item hyp"><div class="row"><b>${esc(d.label)}</b>${badge('HIPOTESE')}<span class="sp"></span><button type="button" class="btn ghost small" data-act="toggleDor" data-key="${d.key}">O prospect confirmou</button></div>
        <div class="small muted">Sinal: ${esc(d.sinais.join('; '))}</div><div class="small" style="margin-top:4px">Pergunte: “${esc(d.pergunta)}” ${copyBtn(d.pergunta, 'copiar')}</div></div>`)}</div>` : ''}
      <details><summary class="small" style="cursor:pointer">Só a conversa revela (${talk.length}) — perguntas para descobrir</summary>
        <div style="margin-top:8px">${list(talk, (d) => `<div class="item"><div class="row"><b>${esc(d.label)}</b><span class="sp"></span><button type="button" class="btn ghost small" data-act="toggleDor" data-key="${d.key}">O prospect confirmou</button></div><div class="small">Pergunte: “${esc(d.pergunta)}”</div></div>`)}</div></details>
    </div>
    <div class="card stack"><h3>O que já faz bem</h3>
      ${r.pontosFortes.length ? `<ul class="clean">${list(r.pontosFortes, claimLi)}</ul>` : '<p class="small muted">Nenhum ponto forte registrado. Não invente elogio: avalie e anote o que realmente é bom.</p>'}
    </div>
    ${aiBox(lead)}`;
}

function aiBox(lead) {
  if (!S.canSample) return '';
  const r = S.ai[lead.profile.id];
  const section = (t, arr, kind) => arr.length ? `<div><span class="sect-label">${t}</span>${list(arr, (c, i) => `<div class="item ${kind === 'gargalos' ? 'hyp' : 'obs'}"><div>${esc(c.texto)} ${badge(c.certeza)}</div><div class="quote">${esc(c.evidencia)}</div><div style="margin-top:6px"><button type="button" class="btn ghost small" data-act="aiSave" data-kind="${kind}" data-i="${i}">Salvar como observação</button></div></div>`)}</div>` : '';
  return `<div class="card stack"><h3>Análise de IA do texto colado</h3>
    <p class="small muted">A IA só pode citar trechos do que você colou (bio, legendas, notas). Item sem trecho comprovável é descartado.</p>
    <div class="row"><button type="button" class="btn ghost" data-act="aiRaioX" ${S.sampling ? 'disabled' : ''}>${S.sampling === 'raiox' ? 'Analisando…' : 'Analisar com IA'}</button></div>
    ${r ? `${section('Observações', r.observacoes, 'observacoes')}${section('Pontos fortes', r.pontosFortes, 'pontosFortes')}${section('Possíveis gargalos (hipóteses)', r.gargalos, 'gargalos')}
      ${!r.observacoes.length && !r.pontosFortes.length && !r.gargalos.length ? '<p class="small muted">A IA não encontrou nada sustentado pelo texto.</p>' : ''}
      ${r.descartados ? `<p class="small muted">${r.descartados} item(ns) descartado(s) por não terem evidência no texto.</p>` : ''}` : ''}</div>`;
}

/* ---------- Por que nós? ---------- */
function tabWhy(lead, a) {
  const w = a.why, o = a.offer, s = a.score;
  if (w.semBase) return `<div class="callout bad">${list(w.avisos, (x) => esc(x))}</div>
    <div class="card" style="margin-top:12px"><h3>Pergunta para começar</h3><p>${esc(w.perguntaPrimeiro)} ${copyBtn(w.perguntaPrimeiro)}</p></div>`;
  return `
    <div class="page-title"><div><h2>Por que este prospect precisaria de nós?</h2>
      <p class="lede">Baseado só no que foi registrado. Confiança ${w.confianca}.</p></div></div>
    ${list(w.avisos, (x) => `<div class="callout" style="margin-bottom:10px">${esc(x)}</div>`)}
    <div class="g2" style="align-items:start">
      <div class="card stack"><h3>Oportunidade</h3><p>${esc(w.oportunidade.texto)} ${badge('HIPOTESE')}</p><div class="quote">${esc(w.oportunidade.evidencia)}</div></div>

/* ===== Eventos, ações e inicialização ===== */
function onBind(el) {
  const lead = curLead();
  if (!lead) return;
  const t = el.dataset.t;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (t === 'num') { const s = el.value.trim().replace(',', '.'); v = s === '' ? '' : parseFloat(s); }
  else if (t === 'bool3') v = el.value === 'sim' ? true : el.value === 'nao' ? false : '';
  else if (t === 'nicho') v = resolveNicho(el.value);
  else v = el.value.trim();
  setPath(lead, el.dataset.bind, v);
  saveLead(lead);
  refreshResults();
}

function onOp(el) {
  const p = el.dataset.op;
  let v;
  if (el.dataset.lines) v = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
  else if (el.dataset.bool) v = el.checked;
  else if (el.type === 'number') { const s = el.value.trim(); v = s === '' ? undefined : parseFloat(s); }
  else v = el.value.trim();
  const ks = p.split('.');
  let cur = S.op;
  for (let i = 0; i < ks.length - 1; i++) { if (cur[ks[i]] == null) cur[ks[i]] = {}; cur = cur[ks[i]]; }
  const last = ks[ks.length - 1];
  if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) delete cur[last]; else cur[last] = v;
  saveOp();
}

function onSvc(el) {
  const key = el.dataset.svc, f = el.dataset.f;
  const c = S.op.catalogo[key] = S.op.catalogo[key] || { ativo: true };
  if (f === 'ativo') c.ativo = el.checked;
  else { const s = el.value.trim(); if (s === '') delete c[f]; else c[f] = Math.max(0, parseFloat(s)); }
  if (c.ticketMin != null && c.ticketMax != null && c.ticketMin > c.ticketMax) toast('O mínimo está maior que o máximo neste serviço.');
  saveOp();
}

const slugify = (s) => E.norm(s).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

const ACTIONS = {
  nav(el) { S.view = el.dataset.view; if (S.view !== 'lead') S.leadId = null; render(); },
  goProspects() { S.view = 'prospects'; S.leadId = null; render(); },
  filter(el) { S.filter = el.dataset.val; render(); },
  copyText(el) { copyText(el.dataset.text); },

  addLead() {
    const h = E.parseHandles($('#np-handle').value)[0];
    if (!h) { toast('Digite o @ do Instagram (letras, números, ponto e sublinhado).'); return; }
    const ex = S.leads.find((l) => l.profile.handle === h);
    if (ex) { toast('Esse perfil já está na lista. Abri para você.'); S.leadId = ex.profile.id; S.view = 'lead'; S.tab = 'raiox'; render(); return; }
    const l = E.newLead(h, $('#np-nome').value);
    l.profile.nicho = resolveNicho($('#np-nicho').value);
    const c = $('#np-cidade').value.trim();
    if (c) l.profile.cidade = c;
    S.leads.push(l); saveLead(l);
    S.leadId = l.profile.id; S.view = 'lead'; S.tab = 'raiox'; render();
  },
  importHandles() {
    const hs = E.parseHandles($('#imp').value);
    if (!hs.length) { toast('Nenhum @ válido encontrado no texto.'); return; }
    const nicho = resolveNicho($('#imp-nicho').value);
    let n = 0;
    for (const h of hs) {
      if (S.leads.some((l) => l.profile.handle === h)) continue;
      const l = E.newLead(h); if (nicho) l.profile.nicho = nicho;
      S.leads.push(l); saveLead(l); n++;
    }
    toast(n + ' prospect(s) importado(s)' + (n < hs.length ? ' (' + (hs.length - n) + ' já existiam)' : '') + '.');
    render();
  },
  loadExample() {
    const l = E.demoLead();
    if (S.leads.some((x) => x.profile.id === l.profile.id)) { toast('O exemplo já está na lista.'); return; }
    S.leads.push(l); saveLead(l); toast('Exemplo fictício carregado. Pode excluir quando quiser.'); render();
  },
  openLead(el) { S.leadId = el.dataset.id; S.view = 'lead'; S.tab = 'raiox'; render(); window.scrollTo(0, 0); },
  askDel(el) { S.confirmDel = el.dataset.id; render(); },
  cancelDel() { S.confirmDel = null; render(); },
  delLead(el) { removeLead(el.dataset.id); S.confirmDel = null; toast('Prospect excluído.'); render(); },
  tab(el) { S.tab = el.dataset.tab; render(); },

  nota(el) {
    const lead = curLead(); if (!lead) return;
    const kind = el.dataset.kind, key = el.dataset.key, v = el.dataset.val;
    const box = kind === 'flat' ? (lead.profile[key] || {}) : ((lead.profile[kind] || {})[key] || {});
    const next = box.nota === v ? 'nao_avaliado' : v;
    setPath(lead, kind === 'flat' ? 'profile.' + key + '.nota' : 'profile.' + kind + '.' + key + '.nota', next);
    const grp = el.closest('.seg');
    $$('button', grp).forEach((b) => { const on = b.dataset.val === next; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    saveLead(lead); refreshResults();
  },
  addNota() {
    const lead = curLead(); if (!lead) return;
    const t = $('#nt-texto').value.trim(), f = $('#nt-fonte').value.trim();
    if (!t || !f) { toast('Preencha a observação e onde você a viu: sem fonte, não vale como fato.'); return; }
    lead.profile.notas.push({ texto: t, fonte: f });
    $('#nt-texto').value = ''; $('#nt-fonte').value = '';
    $('#notas-list').innerHTML = notasList(lead);
    saveLead(lead); refreshResults();
  },
  delNota(el) {
    const lead = curLead(); if (!lead) return;
    lead.profile.notas.splice(+el.dataset.i, 1);
    $('#notas-list').innerHTML = notasList(lead);
    saveLead(lead); refreshResults();
  },
  toggleDor(el) {
    const lead = curLead(); if (!lead) return;
    const k = el.dataset.key, arr = lead.doresConfirmadas;
    const i = arr.indexOf(k);
    if (i >= 0) arr.splice(i, 1); else arr.push(k);
    saveLead(lead); refreshResults();
  },
  aiRaioX() { const lead = curLead(); if (lead) aiRaioX(lead); },
  aiSave(el) {
    const lead = curLead(); if (!lead) return;
    const r = S.ai[lead.profile.id]; if (!r) return;
    const c = r[el.dataset.kind][+el.dataset.i]; if (!c) return;
    lead.profile.notas.push({ texto: (el.dataset.kind === 'gargalos' ? 'Hipótese (IA): ' : '') + c.texto, fonte: 'IA · trecho do texto colado: "' + c.evidencia + '"' });
    $('#notas-list').innerHTML = notasList(lead);
    saveLead(lead); toast('Salvo nas observações.'); refreshResults();
  },

  toggleObj(el) {
    const lead = curLead(); if (!lead) return;
    const k = el.dataset.key, i = lead.objetivos.indexOf(k);
    if (i >= 0) lead.objetivos.splice(i, 1); else lead.objetivos.push(k);
    el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', String(i < 0));
    saveLead(lead); refreshResults();
  },
  addMsg() {
    const lead = curLead(); if (!lead) return;
    const t = $('#cv-text').value.trim();
    if (!t) { toast('Escreva ou cole a mensagem.'); return; }
    lead.conversa.push({ autor: $('#cv-autor').value, texto: t });
    $('#cv-text').value = '';
    $('#conv').innerHTML = convList(lead);
    if (lead.status === 'abordado') lead.status = 'conversa';
    saveLead(lead); refreshResults();
  },
  delMsg(el) {
    const lead = curLead(); if (!lead) return;
    lead.conversa.splice(+el.dataset.i, 1);
    $('#conv').innerHTML = convList(lead);
    saveLead(lead); refreshResults();
  },
  markAbordado() { const lead = curLead(); if (!lead) return; lead.status = 'abordado'; saveLead(lead); toast('Marcado como abordado.'); render(); },
  polish(el) { const lead = curLead(); if (lead) aiPolish(lead, +el.dataset.i); },

  detectObj() { S.obj.text = ($('#ob-text') || {}).value || ''; S.obj.key = ''; render(); },
  useLastMsg() {
    const lead = curLead(); if (!lead) return;
    const m = lead.conversa.filter((x) => x.autor === 'lead').slice(-1)[0];
    S.obj.text = m ? m.texto : ''; S.obj.key = ''; render();
  },
  makePitch() { const lead = curLead(); if (!lead) return; S.pitchOn[lead.profile.id] = true; render(); },

  makePlan() {
    const n = $('#fd-nicho').value.trim();
    if (!n) { toast('Escolha ou digite um nicho.'); return; }
    S.find.nicho = n; S.find.cidade = $('#fd-cidade').value.trim();
    S.find.plan = E.buildSearchPlan(S.op, resolveNicho(n), S.find.cidade);
    render();
  },

  addNicho() {
    const nome = $('#nn-nome').value.trim();
    if (!nome) { toast('Dê um nome ao nicho.'); return; }
    const key = slugify(nome);
    if (E.allNiches(S.op).some((n) => n.key === key || E.norm(n.nome) === E.norm(nome))) { toast('Esse nicho já existe.'); return; }
    const dep = [];
    if ($('#nn-a').checked) dep.push('autoridade'); if ($('#nn-i').checked) dep.push('imagem'); if ($('#nn-q').checked) dep.push('aquisicao');
    S.op.nichosCustom.push({ key, nome, dependeDe: dep }); saveOp(); render();
  },
  delNicho(el) { S.op.nichosCustom.splice(+el.dataset.i, 1); saveOp(); render(); },
  addProof(el) {
    const kind = el.dataset.kind;
    const t = $('#' + kind + '-t').value.trim(), f = $('#' + kind + '-f').value.trim(), d = $('#' + kind + '-d').value.trim();
    if (!t || !f || !d) { toast('Preencha título, fonte e descrição: sem fonte, não é prova.'); return; }
    const item = { tipo: kind === 'diferenciais' ? 'diferencial' : $('#' + kind + '-tipo').value, titulo: t, descricao: d, fonte: f, verificado: $('#' + kind + '-v').checked };
    const r = $('#' + kind + '-r'); if (r && r.value.trim()) item.resultadoDocumentado = r.value.trim();
    S.op[kind].push(item); saveOp(); render();
  },
  toggleProof(el) { const it = S.op[el.dataset.kind][+el.dataset.i]; if (it) { it.verificado = !it.verificado; saveOp(); render(); } },
  delProof(el) { S.op[el.dataset.kind].splice(+el.dataset.i, 1); saveOp(); render(); },

  async exportBackup() {
    if (!dl) return;
    try {
      await dl.save({ filename: 'mesa-prospeccao-backup.json', data: JSON.stringify({ versao: 1, exportadoEm: new Date().toISOString(), op: S.op, leads: S.leads }, null, 2) });
      toast('Backup salvo.');
    } catch (e) { if (!e || e.code !== 'declined') toast('Não consegui salvar o backup agora.'); }
  },
};

function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(String(rd.result));
      const ls = (Array.isArray(d.leads) ? d.leads : []).map(E.normalizeLead).filter(Boolean);
      if (!ls.length && !d.op) { toast('Esse arquivo não parece um backup da Mesa de Prospecção.'); return; }
      for (const l of ls) { const i = S.leads.findIndex((x) => x.profile.id === l.profile.id); if (i >= 0) S.leads[i] = l; else S.leads.push(l); saveLead(l); }
      if (d.op) { S.op = E.normalizeOperacao(d.op); saveOp(); }
      toast(ls.length + ' prospect(s) importado(s) do backup.'); render();
    } catch (e) { toast('Não consegui ler o arquivo de backup.'); }
  };
  rd.readAsText(file);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('#imp-file')) { if (t.files && t.files[0]) importBackup(t.files[0]); t.value = ''; return; }
  if (t.matches('[data-bind]')) return onBind(t);
  if (t.matches('[data-op]')) return onOp(t);
  if (t.matches('[data-svc]')) return onSvc(t);
  if (t.matches('[data-status]')) {
    const l = S.leads.find((x) => x.profile.id === t.dataset.status);
    if (l) { l.status = t.value; saveLead(l); if (S.view === 'prospects') render(); else refreshResults(); }
    return;
  }
  const ch = t.dataset && t.dataset.actChange;
  if (ch === 'approachGargalo') { const lead = curLead(); if (lead) { S.approachGargalo[lead.profile.id] = t.value; render(); } }
  if (ch === 'objKey') { S.obj.key = t.value; S.obj.text = ($('#ob-text') || {}).value || S.obj.text; render(); }
});

if (!E) {
  document.getElementById('app').innerHTML = '<p style="padding:40px 0">Não consegui carregar o motor da Mesa de Prospecção.</p>';
} else {
  const lp = LS.get('mesa.v1.leads');
  if (Array.isArray(lp)) S.leads = lp.map(E.normalizeLead).filter(Boolean);
  const op = LS.get('mesa.v1.op');
  if (op) S.op = E.normalizeOperacao(op);
  render();
  connect();
}

})();
</script>
</body></html>
