# Estilos de legenda animada (palavra por palavra). Usados por scripts/legenda_ass.py
# Cores em #RRGGBB. `ativa` = palavra sendo falada. Fonte: nome INSTALADO no sistema
# (ou arquivo em assets/fontes/, passado com --fontsdir assets/fontes).
_base: &base
  fonte: Montserrat
  negrito: true
  tamanho: 78
  cor: "#FFFFFF"
  ativa: "#FFD400"
  contorno: "#000000"
  contorno_px: 5
  sombra_px: 2
  caixa_alta: true
  palavras_por_linha: 3
  entrada: fade         # fade | slide | nenhuma (efeito quando o bloco de palavras aparece)
  bounce: false         # true = palavra ativa "quica"
  pop: 118              # % de escala no "pulo" da palavra ativa (100 = sem efeito)
  pos_y_pct: 68         # altura do texto (0 topo – 100 base). Zona segura Reels: 60–72
  fundo: null

hormozi:                # impacto: caixa alta, palavra ativa amarela com pulo
  <<: *base

clean:                  # elegante e discreto, ativa em branco puro, resto translúcido
  <<: *base
  fonte: Poppins
  tamanho: 64
  cor: "#FFFFFFB3"
  ativa: "#FFFFFF"
  contorno_px: 0
  sombra_px: 4
  caixa_alta: false
  pop: 106

caixa:                  # palavra ativa com destaque em caixa colorida
  <<: *base
  tamanho: 70
  cor: "#FFFFFF"
  ativa: "#111111"
  ativa_fundo: "#FFD400"
  contorno_px: 0
  sombra_px: 0
  pop: 110

neon:
  <<: *base
  cor: "#FFFFFF"
  ativa: "#00F0FF"
  contorno: "#0040FF"
  contorno_px: 4
  pop: 120

cinema:                 # estilo filme: minúsculas, uma linha, sem animação
  <<: *base
  fonte: DejaVu Serif
  negrito: false
  tamanho: 58
  ativa: "#FFFFFF"
  contorno_px: 2
  caixa_alta: false
  palavras_por_linha: 6
  pop: 100
  pos_y_pct: 82

uma_palavra:            # 1 palavra grande por vez — ritmo máximo (estilo TikTok)
  <<: *base
  palavras_por_linha: 1
  tamanho: 110
  entrada: nenhuma
  bounce: true
  pop: 115

dinamico:               # 2 palavras, entra deslizando, palavra quica
  <<: *base
  palavras_por_linha: 2
  tamanho: 92
  entrada: slide
  bounce: true
